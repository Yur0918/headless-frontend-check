name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (scripts/)
        run: |
          for f in scripts/*.js; do
            node --check "$f"
          done

      # Real-browser smoke on the preinstalled Chrome: exercises lib.findChrome(),
      # launch flags, error collection, screenshots and the config-driven assertions.
      # scripts/smoke.js serves examples/ on an ephemeral loopback port (no python).
      - name: Smoke checks (npm test)
        run: npm test
